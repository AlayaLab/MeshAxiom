<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MeshAxiom: An Agent-Native 3D Foundation Stack for Programmable Worlds. Retained project-page placeholder.">
  <title>MeshAxiom | Alaya Lab</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d12; color: #eef0f5; }
    main { min-height: 100svh; display: grid; place-items: center; padding: 56px 24px; }
    section { max-width: 880px; width: 100%; text-align: center; }
    .eyebrow { margin: 0 0 28px; color: #969dab; letter-spacing: .18em; font-size: 12px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(44px, 8vw, 84px); font-weight: 650; line-height: 1.12; letter-spacing: -.055em; overflow-wrap: anywhere; }
    .lab { display: inline-block; margin-top: 26px; color: #a9bbfb; text-decoration: none; font-size: 20px; }
    .lab:hover { text-decoration: underline; }
    .status { margin: 52px 0 12px; color: #cdd2dc; font-size: 18px; }
    .note { margin: 0; color: #818998; font-size: 14px; line-height: 1.7; }
    a:focus-visible { outline: 2px solid #a9bbfb; outline-offset: 6px; }
    footer { margin-top: 64px; color: #606b7d; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="project-title">
      <p class="eyebrow">Project Page</p>
      <h1 id="project-title">MeshAxiom</h1>
      <a class="lab" href="https://alayalab.ai/">Alaya Lab</a>
      <p class="status">Coming soon.</p>
      <p class="note">Canonical project target: <a href="https://alaya-lab.github.io/MeshAxiom/">alaya-lab.github.io/MeshAxiom/</a>. This directory retains a placeholder; code, weights, and paper remain planned releases.</p>
      <footer>MeshAxiom · Alaya Lab</footer>
    </section>
  </main>
</body>
</html>
