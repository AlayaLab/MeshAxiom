<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeshAxiom</title><style>
:root{font-family:system-ui,sans-serif;color:#e6e9f2;background:#11151c}body{max-width:880px;margin:48px auto;padding:0 24px}h1{font-size:34px;letter-spacing:-1px}p{color:#aeb8ca;line-height:1.7}section{border:1px solid #303a4c;border-radius:16px;padding:24px;margin:24px 0;background:#19202a}h2{margin-top:0}label{display:block;margin:16px 0 6px}input,select,button{font:inherit;border-radius:8px;border:1px solid #48566d;padding:10px;background:#111821;color:#e6e9f2}input[type=file]{width:calc(100% - 22px)}button{background:#6070e8;border-color:#6070e8;cursor:pointer;margin-top:22px}button:disabled{opacity:.5;cursor:wait}.grid{display:flex;gap:24px;flex-wrap:wrap}.grid input{width:140px}a{color:#a9b6ff}#result{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:20px}small{display:block;color:#9faec4;margin-top:8px}#downloads a{display:inline-block;margin:8px 16px 8px 0}.status{padding:16px;border-left:3px solid #6070e8;margin-top:24px;display:none}</style></head><body>
<h1>MeshAxiom</h1><p>输入一张图片，生成可编辑的三角网格；也可以给已有模型生成材质。</p>
<section><h2>图片生成网格</h2><form id="geometry"><label>参考图片</label><input id="geometry-image" type="file" accept="image/png,image/jpeg,image/webp" required><div class="grid"><div><label>目标面数</label><input id="face-budget" type="number" value="8000" min="100" max="30000"></div><div><label>随机种子</label><input id="geometry-seed" type="number" value="2026082301" min="0"></div></div><label>背景处理</label><select id="background"><option value="auto">自动去背景 / 使用透明背景</option><option value="keep">保留整张图片</option><option value="alpha">使用图片透明背景</option></select><small>目标面数控制复杂度，实际面数以生成结果为准。</small><button type="submit">生成网格</button></form></section>
<section><h2>已有模型生成材质</h2><form id="material"><label>网格文件</label><input id="material-mesh" type="file" accept=".glb,.obj,.json" required><label>材质参考图片</label><input id="material-image" type="file" accept="image/png,image/jpeg,image/webp" required><div class="grid"><div><label>贴图尺寸</label><select id="texture-size"><option>1024</option><option selected>2048</option><option>4096</option></select></div><div><label>随机种子</label><input id="material-seed" type="number" value="42" min="0"></div></div><details><summary>相机参数（可选）</summary><label>相机 JSON</label><input id="camera" placeholder='{"camera_angle_x": 0.3490658504, "distance": 2.5}' style="width:calc(100% - 22px)"><small>默认根据参考图前景拟合相机；复杂背景建议提供透明 PNG。</small></details><button type="submit">生成材质</button></form></section>
<div class="status" id="status" role="status" aria-live="polite"></div><div id="downloads"></div><details id="result-details" hidden><summary>调用结果 JSON</summary><pre id="result"></pre></details>
<script>
const statusNode=document.querySelector('#status'), downloads=document.querySelector('#downloads');
let busy=false;
function status(text){statusNode.style.display='block';statusNode.textContent=text}
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}
async function upload(file){if(!file)throw new Error('请选择输入文件');return (await api('/v1/uploads',{method:'POST',headers:{'X-Filename':file.name},body:file})).upload_id}
async function run(event,operation){event.preventDefault();if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);downloads.replaceChildren();document.querySelector('#result-details').hidden=true;
try{status('正在上传输入…');const image=await upload(document.querySelector('#'+operation+'-image').files[0]);const payload={operation,image_upload:image,seed:Number(document.querySelector('#'+operation+'-seed').value)};
if(operation==='geometry'){payload.face_budget=Number(document.querySelector('#face-budget').value);payload.background=document.querySelector('#background').value}else{payload.mesh_upload=await upload(document.querySelector('#material-mesh').files[0]);payload.texture_size=Number(document.querySelector('#texture-size').value);const camera=document.querySelector('#camera').value.trim();if(camera)payload.camera=JSON.parse(camera)}
if(!Number.isSafeInteger(payload.seed)||payload.seed<0)throw new Error('浏览器随机种子必须是 0 到 9007199254740991 之间的整数');
const submitted=await api('/v1/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let job;
while(true){job=await api(submitted.status_url);status(job.status==='queued'?'任务已排队…':'正在生成…');if(['complete','failed'].includes(job.status))break;await new Promise(resolve=>setTimeout(resolve,1500))}
document.querySelector('#result-details').hidden=false;document.querySelector('#result').textContent=JSON.stringify(job,null,2);if(job.status==='failed')throw new Error(job.error||'生成失败');
status('生成完成。可以下载结果。');for(const [name,row] of Object.entries(job.result.artifacts)){const a=document.createElement('a');a.href=row.download_url;a.textContent='下载 '+name;a.download='';downloads.append(a)}
}catch(error){status(error.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelector('#geometry').addEventListener('submit',e=>run(e,'geometry'));document.querySelector('#material').addEventListener('submit',e=>run(e,'material'));
</script></body></html>
